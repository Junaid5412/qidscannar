name: Build QID Scanner (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions

# Store builds need a build number that grows with every upload (Play versionCode /
# iOS CFBundleVersion). The run number does exactly that; the version name stays the
# one in pubspec.yaml.
env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # ------------------------------------------------------------
  # JOB 1: Android — Play Store bundle (.aab) + installable APK
  # Signed with the Play upload key when these repository secrets exist:
  #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  # ------------------------------------------------------------
  build_android:
    name: Build Android (Play bundle + APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run app tests
        working-directory: ./mobile_app
        run: |
          flutter pub get
          flutter test

      - name: Configure Android Platform
        working-directory: ./mobile_app
        run: |
          # Backup our custom Android config files
          cp android/app/build.gradle /tmp/build.gradle.bak
          cp android/settings.gradle /tmp/settings.gradle.bak
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/src/main/kotlin/com/smartstep/qidscanner/MainActivity.kt /tmp/MainActivity.kt.bak
          cp android/app/src/main/res/values/styles.xml /tmp/styles.xml.bak
          cp android/app/src/main/res/drawable/launch_background.xml /tmp/launch_background.xml.bak
          cp android/gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak

          # Run flutter create to generate all missing resources (mipmap icons, etc.)
          flutter create --platforms=android --org com.smartstep --project-name qid_scanner .

          # Restore our custom files over the generated ones
          cp /tmp/build.gradle.bak android/app/build.gradle
          cp /tmp/settings.gradle.bak android/settings.gradle
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/MainActivity.kt.bak android/app/src/main/kotlin/com/smartstep/qidscanner/MainActivity.kt
          cp /tmp/styles.xml.bak android/app/src/main/res/values/styles.xml
          cp /tmp/launch_background.xml.bak android/app/src/main/res/drawable/launch_background.xml
          cp /tmp/gradle-wrapper.properties.bak android/gradle/wrapper/gradle-wrapper.properties

          # Remove .kts duplicates generated by flutter create (we use .gradle files)
          rm -f android/app/build.gradle.kts android/settings.gradle.kts android/build.gradle.kts
          # ...and any second MainActivity it made under its own package folder
          find android/app/src/main/kotlin android/app/src/main/java -name 'MainActivity.*' -not -path '*/com/smartstep/qidscanner/*' -delete 2>/dev/null || true

      - name: Install Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Generate app icons
        working-directory: ./mobile_app
        # Per-platform config: this job only creates the android/ folder, so a config
        # touching ios/ would fail on a missing AppIcon.appiconset.
        run: dart run flutter_launcher_icons -f icons_android.yaml

      - name: Build Android App Bundle + APK (Release)
        working-directory: ./mobile_app
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
            echo "Signing with the Play upload key."
          else
            echo "::warning::Android signing secrets not set - the build is signed with the DEBUG key and Google Play will refuse it."
          fi

          # .aab is what Google Play accepts; the .apk is for installing directly on a phone
          flutter build appbundle --release --build-number="$BUILD_NUMBER" --android-skip-build-dependency-validation
          flutter build apk --release --build-number="$BUILD_NUMBER" --android-skip-build-dependency-validation

          echo "=== Signing certificate of the bundle ==="
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256" || true

      - name: Stage Android Artifacts
        run: |
          mkdir -p android_out
          cp mobile_app/build/app/outputs/bundle/release/app-release.aab "android_out/qid-scanner-${BUILD_NUMBER}-play.aab"
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk "android_out/qid-scanner-${BUILD_NUMBER}.apk"
          ls -lh android_out

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QID-Scanner-Android
          path: android_out/*
          retention-days: 30

  # ------------------------------------------------------------
  # JOB 2: iOS — App Store build (.ipa), optionally uploaded to TestFlight
  # Signed when these repository secrets exist:
  #   IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD   Apple Distribution certificate (.p12)
  #   IOS_PROVISION_BASE64                     App Store provisioning profile for com.smartstep.qidscanner
  # Uploaded to App Store Connect / TestFlight when these exist as well:
  #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64   App Store Connect API key
  # ------------------------------------------------------------
  build_ios:
    name: Build iOS (App Store)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure iOS Platform
        working-directory: ./mobile_app
        run: |
          # ios/Runner/Info.plist is kept in the repository (camera / Face ID texts, HTTPS-only
          # networking, export-compliance answer); flutter create only adds what is missing.
          flutter create --platforms=ios --org com.smartstep --project-name qid_scanner .
          plutil -lint ios/Runner/Info.plist

          # App privacy manifest, added to the bundle by ci/configure_ios_project.rb
          cp ios_privacy/PrivacyInfo.xcprivacy ios/Runner/PrivacyInfo.xcprivacy

          # iOS 15.5 minimum for ML Kit
          sed -i '' -E "s/^#? ?platform :ios.*/platform :ios, '15.5'/" ios/Podfile

      - name: Install Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Generate app icons
        working-directory: ./mobile_app
        # Replaces the default Flutter icon, which Apple rejects under guideline 4.0.
        run: dart run flutter_launcher_icons -f icons_ios.yaml

      - name: Install signing certificate and profile
        id: sign
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          set -eo pipefail
          if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_PROVISION_BASE64" ]; then
            echo "::warning::iOS signing secrets not set - producing an UNSIGNED build (cannot be uploaded to the App Store)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CERT="$RUNNER_TEMP/cert.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$CERT"
          echo "$IOS_PROVISION_BASE64" | base64 --decode > "$PROFILE"

          # A throw-away keychain keeps the key off the runner's login keychain.
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Without this, codesign waits for a GUI password prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution\|iPhone Distribution" \
            || { echo "::error::The .p12 is not an Apple Distribution certificate."; exit 1; }

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::\"$NAME\" is an Ad Hoc / development profile. The App Store needs an 'App Store Connect' distribution profile."
            exit 1
          fi
          case "$APPID" in *".com.smartstep.qidscanner") ;; *) echo "::error::Profile is for $APPID, not com.smartstep.qidscanner."; exit 1;; esac

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          echo "Profile: $NAME  team: $TEAM"
          {
            echo "TEAM_ID=$TEAM"
            echo "PROFILE_NAME=$NAME"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Xcode project
        working-directory: ./mobile_app
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj
          ruby ci/configure_ios_project.rb

      - name: Build iOS app
        working-directory: ./mobile_app
        run: |
          set -eo pipefail
          mkdir -p ../ios_output
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.smartstep.qidscanner</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
            flutter build ipa --release --build-number="$BUILD_NUMBER" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
            cp build/ios/ipa/*.ipa "../ios_output/qid-scanner-${BUILD_NUMBER}-appstore.ipa"
          else
            flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
            cd build/ios/iphoneos
            mkdir -p Payload && cp -R Runner.app Payload/
            zip -r -y "../../../../ios_output/qid-scanner-${BUILD_NUMBER}-unsigned.ipa" Payload >/dev/null
          fi
          ls -lh ../ios_output

      - name: Upload to App Store Connect (TestFlight)
        if: steps.sign.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::notice::App Store Connect API key not set - download the .ipa artifact and upload it yourself."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file ios_output/*-appstore.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${BUILD_NUMBER}. It appears in App Store Connect → TestFlight after Apple's processing (about 10-30 minutes)."

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QID-Scanner-iOS
          path: ios_output/*
          if-no-files-found: warn
          retention-days: 30
