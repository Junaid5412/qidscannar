name: Build QID Scanner (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions

jobs:
  # ------------------------------------------------------------
  # JOB 1: Build Android APK (Debug & Release)
  # ------------------------------------------------------------
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Platform
        working-directory: ./mobile_app
        run: |
          # Backup our custom Android config files
          cp android/app/build.gradle /tmp/build.gradle.bak
          cp android/settings.gradle /tmp/settings.gradle.bak
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/src/main/kotlin/com/qid/scanner/MainActivity.kt /tmp/MainActivity.kt.bak
          cp android/app/src/main/res/values/styles.xml /tmp/styles.xml.bak
          cp android/app/src/main/res/drawable/launch_background.xml /tmp/launch_background.xml.bak
          cp android/gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak

          # Run flutter create to generate all missing resources (mipmap icons, etc.)
          flutter create --platforms=android --org com.qid --project-name qid_scanner .

          # Restore our custom files over the generated ones
          cp /tmp/build.gradle.bak android/app/build.gradle
          cp /tmp/settings.gradle.bak android/settings.gradle
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/MainActivity.kt.bak android/app/src/main/kotlin/com/qid/scanner/MainActivity.kt
          cp /tmp/styles.xml.bak android/app/src/main/res/values/styles.xml
          cp /tmp/launch_background.xml.bak android/app/src/main/res/drawable/launch_background.xml
          cp /tmp/gradle-wrapper.properties.bak android/gradle/wrapper/gradle-wrapper.properties

          # Verify mipmap icons exist
          echo "=== Checking mipmap resources ==="
          find android/app/src/main/res/mipmap-* -name "*.png" | head -20 || echo "WARNING: No mipmap icons found"

          # Remove .kts duplicates generated by flutter create (we use .gradle files)
          rm -f android/app/build.gradle.kts android/settings.gradle.kts android/build.gradle.kts

      - name: Install Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: ./mobile_app
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Stage Android APK Artifacts
        run: |
          mkdir -p android_apks
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk android_apks/qid-scanner-release.apk
          ls -lh android_apks

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QID-Scanner-Android-APK
          path: android_apks/*.apk
          retention-days: 30

  # ------------------------------------------------------------
  # JOB 2: Build iOS App Bundle (iPhone)
  # ------------------------------------------------------------
  build_ios:
    name: Build iOS Bundle (iPhone)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure iOS Platform
        working-directory: ./mobile_app
        run: |
          flutter create --platforms=ios --org com.qid --project-name qid_scanner .
          plutil -insert NSCameraUsageDescription -string "This app requires camera access to scan Qatar ID card barcodes." ios/Runner/Info.plist || true
          plutil -insert NSAppTransportSecurity -xml "<dict><key>NSAllowsArbitraryLoads</key><true/></dict>" ios/Runner/Info.plist || true
          # Required by local_auth on Face ID devices. iOS terminates the app the
          # moment Face ID is requested without this key, so its absence would
          # crash the fingerprint login rather than merely refuse it.
          plutil -insert NSFaceIDUsageDescription -string "Use Face ID to unlock the QID Scanner without typing your password." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "Select a photo of a Qatar ID card to scan it." ios/Runner/Info.plist || true
          # Force iOS 15.5 deployment target for ML Kit compatibility
          sed -i '' -E "s/^#? ?platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g" ios/Runner.xcodeproj/project.pbxproj

          # Pin the bundle identifier to match Android. Flutter would otherwise
          # derive com.qid.qidScanner from the project name, and the identifier
          # registered with Apple must match the binary exactly or signing fails.
          # The RunnerTests target keeps its own suffixed id, hence the skip.
          sed -i '' -E "/RunnerTests/!s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.qid.scanner;/" ios/Runner.xcodeproj/project.pbxproj
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj

      - name: Install Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build iOS Application
        working-directory: ./mobile_app
        run: |
          flutter build ios --release --no-codesign

      - name: Package iOS Runner Archive
        run: |
          mkdir -p ios_output
          cd mobile_app/build/ios/iphoneos

          # Plain Runner.app, kept for anyone signing it with Xcode directly.
          zip -r -y ../../../../ios_output/qid-scanner-ios-app.zip Runner.app

          # A real .ipa: an IPA is just a zip whose top level is Payload/.
          # Signing tools (AppUploader, Xcode, Transporter) only accept this
          # layout, so without the wrapper the build cannot be resigned or
          # installed on a device at all.
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y ../../../../ios_output/qid-scanner-unsigned.ipa Payload
          rm -rf Payload

          cd ../../../..
          ls -lh ios_output

      # ----------------------------------------------------------------
      # Sign the build so it can actually be installed on a device.
      #
      # iOS refuses any app without a code signature and an embedded
      # provisioning profile, so the unsigned IPA above is only useful as an
      # input to this step. Re-signing the built .app is used rather than
      # letting Xcode archive with signing, because it needs no signing
      # configuration inside the project and works the same every run.
      #
      # The whole step is skipped when the secrets are absent, so the workflow
      # still produces the unsigned artifact for anyone without certificates.
      # ----------------------------------------------------------------
      - name: Sign iOS app
        id: sign
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          set -eo pipefail

          if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_PROVISION_BASE64" ]; then
            echo "::warning::iOS signing secrets not set - producing an UNSIGNED build only."
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CERT="$RUNNER_TEMP/cert.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(uuidgen)"

          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$CERT"
          echo "$IOS_PROVISION_BASE64" | base64 --decode > "$PROFILE"

          # A dedicated keychain keeps the key off the runner's login keychain
          # and is thrown away with the machine.
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          # Without this, codesign blocks on a GUI password prompt that can
          # never be answered on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | head -n 1 | awk -F'"' '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No codesigning identity found in the supplied .p12."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"

          # Entitlements must come from the profile itself; inventing them causes
          # a mismatch that iOS rejects at install time.
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          echo "Devices in profile: $(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -c . || echo 'none (not ad-hoc)')"

          cd mobile_app/build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          APP="Payload/Runner.app"

          cp "$PROFILE" "$APP/embedded.mobileprovision"

          # Nested code must be signed before the bundle that contains it,
          # otherwise sealing the outer bundle invalidates the inner signatures.
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 |
              while IFS= read -r -d '' item; do
                echo "  signing $(basename "$item")"
                codesign --force --timestamp=none --sign "$IDENTITY" "$item"
              done
          fi

          codesign --force --timestamp=none --sign "$IDENTITY" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          zip -r -y ../../../../ios_output/qid-scanner-signed.ipa Payload >/dev/null
          rm -rf Payload

          cd ../../../..
          ls -lh ios_output
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Upload iOS Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QID-Scanner-iOS-App
          path: |
            ios_output/qid-scanner-ios-app.zip
            ios_output/qid-scanner-unsigned.ipa
            ios_output/qid-scanner-signed.ipa
          if-no-files-found: warn
          retention-days: 30
