# Icon config for the Android job only.
#
# The Android job runs `flutter create --platforms=android`, so no ios/ folder
# exists there. A shared config with `ios: true` makes the generator fail on a
# missing AppIcon.appiconset, which is what broke the build.
#
# Adaptive icon (Android 8+): the launcher masks it to the phone's own shape
# (circle, squircle …), so the card artwork sits in the safe centre of the foreground.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
